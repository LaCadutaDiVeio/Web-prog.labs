name: taskmaster

services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/code/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend/app
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/app:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
