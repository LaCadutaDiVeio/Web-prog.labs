<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet",  href="css/base.css">
    <link rel="stylesheet",  href="css/auth.css">
    <title>Вход</title>
</head>

<body>
    <main>
        <section>
            <h1>Вход</h1>
            <h2>Управляйте задачами команды в одном месте!</h2>

            <form action="#" method="post">
                <div>
                    Электронная почта
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    Пароль
                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                    >
                </div>

                <button type="submit">Войти</button>
            </form>

            <p>
                Нет аккаунта?
                <a href="register.html">Зарегистрируйтесь!</a>
            </p>
        </section>
    </main>
</body>
</html>
