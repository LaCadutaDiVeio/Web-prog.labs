<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <title>Регистрация</title>
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">
            <h1>Регистрация</h1>

            <form class="auth-form"> <!--заготовка для будущих методов-->
                <div class="form-field">
                    Логин
                    <input class="form-field_input"
                        id="login"
                        name="login"
                        type="text"
                        placeholder="user1234"
                        required
                    >
                </div>
                <div class="form-field">
                    Почта
                    <input class="form-field_input"
                        id="email"
                        name="email"
                        type="email"
                        placeholder="youre@really.cool"
                        required
                    >
                </div>
                <div class="form-field">
                    Пароль
                    <input class="form-field_input"
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        placeholder="Не менее 8 символов"
                        required
                    >
                </div>
                <div class="form-field">
                    Повторите пароль
                    <input class="form-field_input"
                        id="password-repeat"
                        name="password-repeat"
                        type="password"
                        minlength="8"
                        placeholder="Не используйте копирование :)"
                        required
                    >
                </div>

                <button class="auth-button"
                    type="submit">Зарегистрироваться
                </button>
            </form>
            
            <p class="auth-option-switch">
                Уже есть аккаунт?
                <a class="auth-option-switch_link"
                    href="login.html">
                    Войдите!
                </a>
            </p>
        </section>
    </main>
</body>
</html>
