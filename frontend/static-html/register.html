<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet",  href="css/base.css">
    <link rel="stylesheet",  href="css/auth.css">
    <title>Вход</title>
</head>

<body>
    <main>
        <section>
            <h1>Регистрация</h1>

            <form> <!--заготовка для будущих методов-->
                <div>
                    Логин
                    <input
                        id="login"
                        name="login"
                        type="login"
                        required
                    >
                </div>
                <div>
                    Почта
                    <input
                        id="email"
                        name="email"
                        type="email"
                        required
                    >
                </div>
                <div>
                    Пароль
                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                    >
                </div>
                <div>
                    Повторите пароль
                    <input
                        id="password-repeat"
                        name="password-repeat"
                        type="password"
                        required
                    >
                </div>

                <button type="submit">Зарегистрироваться</button>
            </form>
            
            <p>
                Уже есть аккаунт?
                <a hreff="login.html">Войдите!</a>
            </p>
        </section>
    </main>
</body>
</html>
